services:
  - type: web
    name: jarvis-backend
    env: python
    region: us-east
    plan: free
    rootDIR: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: HERMES_CLI_PATH
        value: /app/hermes_agent/hermes_cli/main.py
      - key: HERMES_CLI_TIMEOUT
        value: "30"
      - key: TTS_VOICE
        value: vi-VN-NamMinhNeural
